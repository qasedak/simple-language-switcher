# Build the installable plugin zip and attach it to a published release.
# Packaging lives in bin/build-plugin-zip.sh so the same archive can be
# built locally with: bash bin/build-plugin-zip.sh
name: Release plugin zip

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and upload plugin zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build plugin zip
        run: bash bin/build-plugin-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-language-switcher
          path: build/simple-language-switcher.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/simple-language-switcher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
